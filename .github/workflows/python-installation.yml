name: Installing Python

on:
  push:

jobs:
  build:
    runs-on: self-hosted

    strategy:
      matrix:
        py-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py-version }}

      - run: python --version
